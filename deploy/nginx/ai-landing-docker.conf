# Lend (AI Landing Factory) behind the server's shared nginx.
#
# The server's own nginx owns ports 80/443 for every project on it and sends each domain to
# its project. Lend's gateway container listens on 127.0.0.1:18080 only
# (lend.env: LEND_GATEWAY=proxy, LEND_BIND=127.0.0.1, LEND_HTTP_PORT=18080).
# Everything goes to the gateway as is: it splits /api/v1/ from the pages itself.
#
#   sudo cp ai-landing-docker.conf /etc/nginx/sites-available/landing-factory.conf
#   sudo ln -s /etc/nginx/sites-available/landing-factory.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d landing-factory.neural-university.ru   # certificate and HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name landing-factory.neural-university.ru;

    # Presentations and documents are uploaded through this site.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Lend reads the visitor's address (login throttle) and the scheme (Secure cookie) here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Building a landing from large files can take minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
