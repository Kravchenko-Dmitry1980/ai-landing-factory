# Lend behind the Traefik of a shared server: Traefik owns ports 80/443, gets the certificate
# for LEND_DOMAIN and sends that domain to the gateway over Traefik's Docker network.
# Turned on in .env (docker-compose then reads both files, commands stay the same):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
#   LEND_GATEWAY=proxy, LEND_DOMAIN, LEND_TRAEFIK_NETWORK (+ entry points and resolver if not default)

version: '3.8'

services:
  gateway:
    networks:
      - lend_net
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${LEND_TRAEFIK_NETWORK}
      traefik.http.services.lend.loadbalancer.server.port: "80"
      traefik.http.routers.lend.rule: Host(`${LEND_DOMAIN}`)
      traefik.http.routers.lend.entrypoints: ${LEND_TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.lend.tls: "true"
      traefik.http.routers.lend.tls.certresolver: ${LEND_TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.lend.service: lend
      # Plain HTTP to the same name goes to HTTPS (harmless if Traefik already redirects).
      traefik.http.routers.lend-http.rule: Host(`${LEND_DOMAIN}`)
      traefik.http.routers.lend-http.entrypoints: ${LEND_TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.lend-http.middlewares: lend-to-https
      traefik.http.routers.lend-http.service: lend
      traefik.http.middlewares.lend-to-https.redirectscheme.scheme: https
      traefik.http.middlewares.lend-to-https.redirectscheme.permanent: "true"

networks:
  traefik:
    external: true
    name: ${LEND_TRAEFIK_NETWORK}
