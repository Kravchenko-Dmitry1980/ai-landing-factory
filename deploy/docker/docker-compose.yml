# Lend — the whole product on one server (docker-compose v1 compatible, 1.29.x).
# Run from deploy/docker: sudo docker-compose build && sudo docker-compose up -d --renew-anon-volumes
# (the flag works around docker-compose v1 failing to recreate containers on Docker 29).
# Build context is the repository root (../../ from this file); .dockerignore keeps local data out.
#
# gateway  — the only public entry: nginx in a container, no nginx on the host needed
# backend  — FastAPI, one process (edit locks and the login throttle live in its memory)
# frontend — Next.js
# Accounts, landings and the library live in the volume LEND_DATA_VOLUME (default lend_data):
# it outlives containers and releases.

version: '3.8'

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: lend-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${LEND_BIND:-0.0.0.0}:${LEND_HTTP_PORT:-80}:80"
      - "${LEND_BIND:-0.0.0.0}:${LEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./gateway/${LEND_GATEWAY:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/routes.inc:/etc/nginx/lend/routes.inc:ro
      - ${LEND_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    networks:
      - lend_net

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: lend-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PRODUCT_MODE: ${PRODUCT_MODE:-simple}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - lend_data:/app/backend/data
    ports:
      # Loopback only, for health checks from the host.
      - "127.0.0.1:18001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lend_net

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        INTERNAL_API_URL: http://backend:8001/api/v1
    container_name: lend-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:8001/api/v1
      # The publish route trusts the same site addresses as the backend.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - lend_net

volumes:
  lend_data:
    name: ${LEND_DATA_VOLUME:-lend_data}

networks:
  lend_net:
    driver: bridge
    # Docker 28+ stores these two options on every network. docker-compose v1 compares a
    # network's options with this file and, finding ones it did not set, refuses to work with
    # the existing network ("needs to be recreated"). Stating them keeps both sides equal.
    driver_opts:
      com.docker.network.enable_ipv4: "true"
      com.docker.network.enable_ipv6: "false"
