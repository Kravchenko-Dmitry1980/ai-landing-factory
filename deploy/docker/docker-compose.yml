# Docker-first deploy — docker-compose v1 compatible (1.29.x)
# Run from repo root or deploy/docker with: sudo docker-compose -f deploy/docker/docker-compose.yml ...
# Build context is repository root (../../ from this file).

version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: alf-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PRODUCT_MODE: ${PRODUCT_MODE:-simple}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://127.0.0.1:13000,http://localhost:13000}
    volumes:
      - alf_backend_data:/app/backend/data
    ports:
      - "127.0.0.1:18001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alf_net

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:18001/api/v1}
    container_name: alf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - alf_net

volumes:
  alf_backend_data:

networks:
  alf_net:
    driver: bridge
