# Static demo only — nginx template
# Place under /etc/nginx/sites-available/ and symlink to sites-enabled.
# Replace YOUR_DOMAIN and ensure files are under /var/www/ai-landing-demo.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/ai-landing-demo;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No backend / API in static mode.
    location /api/ {
        return 404;
    }
}
