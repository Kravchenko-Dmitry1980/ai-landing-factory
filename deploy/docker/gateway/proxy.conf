# Lend gateway behind the server's shared reverse proxy (Traefik or nginx on the host), which
# owns ports 80/443, terminates HTTPS and sends Lend's domain here over plain HTTP.
# Only that proxy should reach this port: LEND_BIND=127.0.0.1 or a Docker network.
server {
    listen 80 default_server;
    server_name _;

    # The visitor's address comes from the proxy's X-Forwarded-For; without this the login
    # throttle would see every visitor as the proxy. Trusted only from loopback and private
    # ranges (Docker networks, the host), never from a public address.
    # Not recursive: the last address is the one the proxy itself added. Addresses before it
    # came from the visitor (nginx appends to theirs) and could be made up.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # The visitor came over HTTPS to the proxy: the session cookie must get "Secure".
    set $lend_proto $http_x_forwarded_proto;
    if ($lend_proto = "") {
        set $lend_proto $scheme;
    }
    include /etc/nginx/lend/routes.inc;
}
