# Lend gateway over HTTPS. Certificates: deploy/docker/certs/fullchain.pem and privkey.pem
# (or LEND_CERTS_DIR in .env). Plain HTTP only redirects, except the health check.
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $lend_backend http://backend:8001;
        proxy_pass $lend_backend;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lend_ssl:10m;

    # One day while HTTPS is new: a mistake with the certificate locks browsers out only until
    # tomorrow. Raise to a year (31536000) once HTTPS has worked for a few weeks.
    add_header Strict-Transport-Security "max-age=86400" always;
    set $lend_proto $scheme;
    include /etc/nginx/lend/routes.inc;
}
